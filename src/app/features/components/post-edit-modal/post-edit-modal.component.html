<div 
*ngIf="isOpen"
class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50"
(keydown.escape)="onCancel()"
(click)="onBackdropClick($event)"
tabindex="0"
>
<div 
  class="bg-white rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto"
  role="dialog"
  aria-labelledby="edit-modal-title"
  aria-modal="true"
  (click)="$event.stopPropagation()"
>
  <div class="p-6">
    <div class="flex justify-between items-center mb-4">
      <h2 id="edit-modal-title" class="text-2xl font-bold text-gray-900">
        Editar Post
      </h2>
      <button
        (click)="onCancel()"
        class="text-gray-400 hover:text-gray-600 transition-colors"
        type="button"
        aria-label="Close modal"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <form (ngSubmit)="onSave()" class="space-y-4">
      <div>
        <label for="edit-title" class="block text-sm font-medium text-gray-700 mb-1">
          Titulo *
        </label>
        <input
          type="text"
          id="edit-title"
          [(ngModel)]="formData.title"
          name="title"
          required
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          placeholder="Insira o título do Post"
        >
      </div>

      <div>
        <label for="edit-body" class="block text-sm font-medium text-gray-700 mb-1">
            Comentario *
        </label>
        <textarea
          id="edit-body"
          [(ngModel)]="formData.body"
          name="body"
          rows="8"
          required
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          placeholder="Insira o comentario do Post"
        ></textarea>
      </div>


      <div *ngIf="error()" class="bg-red-50 border border-red-200 rounded-md p-3">
        <p class="text-red-600 text-sm">{{ error() }}</p>
      </div>

      <div class="flex justify-end gap-3 pt-4 border-t border-gray-200">
        <button
          type="button"
          (click)="onCancel()"
          class="px-4 py-2 text-gray-600 border border-gray-300 rounded-md hover:bg-gray-50 transition-colors"
        >
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="loading() || !formData.title.trim() || !formData.body.trim()"
          class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors flex items-center gap-2"
        >
          <span *ngIf="loading()" class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></span>
          {{ loading() ? 'Salvando...' : 'Salvar' }}
        </button>
      </div>
    </form>
  </div>
</div>
</div>
