<div 
class="fixed top-4 right-4 z-50 max-w-sm w-full space-y-2"
*ngIf="toasts().length > 0"
>
<div 
  *ngFor="let toast of toasts()"
  class="p-4 rounded-lg shadow-lg border-l-4 flex items-center justify-between animate-in slide-in-from-right duration-300"
  [class]="getToastClass(toast.type)"
>
  <div class="flex items-center gap-2">
    <span class="text-sm font-medium">{{ toast.message }}</span>
  </div>
  <button 
    class="text-gray-500 hover:text-gray-700 ml-4"
    (click)="removeToast(toast.id)"
  >
    ✕
  </button>
</div>
</div>
